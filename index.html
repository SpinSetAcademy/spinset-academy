<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SpinSet Academy</title>

<style>
/* ========== GLOBAL ========== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0b1b2b, #102a43);
  color: white;
  overflow-x: hidden;
}

/* fade in animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

section {
  animation: fadeIn 0.8s ease;
}

/* ========== HEADER ========== */
header {
  text-align: center;
  padding: 30px 10px;
}

header h1 {
  font-size: 42px;
  margin: 0;
  letter-spacing: 2px;
}

header p {
  opacity: 0.8;
}

/* ========== CALENDAR ========== */
.calendar {
  width: 90%;
  max-width: 900px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.day-name {
  text-align: center;
  font-weight: bold;
  opacity: 0.7;
}

.day {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s;
  position: relative;
}

.day:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.18);
}

.booked {
  background: rgba(255, 0, 0, 0.35);
  border: 1px solid rgba(255,0,0,0.6);
}

.booked::after {
  content: "Booked";
  position: absolute;
  bottom: 5px;
  font-size: 10px;
  opacity: 0.8;
}

/* ========== COMMENTS ========== */
.comments {
  width: 90%;
  max-width: 700px;
  margin: 40px auto;
}

textarea {
  width: 100%;
  height: 80px;
  border-radius: 10px;
  border: none;
  padding: 10px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #00c2ff;
  color: black;
  cursor: pointer;
}

/* ========== CURSOR BALL ========== */
.cursor-ball {
  position: fixed;
  width: 18px;
  height: 18px;
  background: yellow;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  box-shadow: 0 0 10px yellow;
}

.trail {
  position: fixed;
  width: 10px;
  height: 10px;
  background: rgba(255,255,0,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(0);
  }
}

/* ========== BUTTON HOVER LIFT ========== */
button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<header>
  <h1>SpinSet Academy</h1>
  <p>Elite Youth Tennis Training</p>
</header>

<!-- CALENDAR -->
<section>
  <div class="calendar" id="calendar">
    <div class="day-name">Mon</div>
    <div class="day-name">Tue</div>
    <div class="day-name">Wed</div>
    <div class="day-name">Thu</div>
    <div class="day-name">Fri</div>
    <div class="day-name">Sat</div>
    <div class="day-name">Sun</div>
  </div>
</section>

<!-- COMMENTS -->
<section class="comments">
  <h2>Comments</h2>
  <textarea placeholder="Write feedback..."></textarea>
  <button onclick="alert('Submitted!')">Submit</button>
</section>

<div class="cursor-ball" id="ball"></div>

<script>
// ========== CALENDAR GENERATION ==========
const calendar = document.getElementById("calendar");

// example: 30 days
const totalDays = 30;

// Mon-Fri booked pattern (example logic)
for (let i = 1; i <= totalDays; i++) {

  const div = document.createElement("div");
  div.classList.add("day");
  div.innerText = i;

  // mark Mon-Fri cycles as booked (simple pattern)
  const dayOfWeek = (i - 1) % 7; // 0-6
  if (dayOfWeek < 5) {
    div.classList.add("booked");
  }

  div.onclick = () => {
    alert("Clicked date: " + i);
  };

  calendar.appendChild(div);
}

// ========== CURSOR BALL ==========
const ball = document.getElementById("ball");

let mouseX = 0, mouseY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  // trail
  const trail = document.createElement("div");
  trail.className = "trail";
  trail.style.left = mouseX + "px";
  trail.style.top = mouseY + "px";
  document.body.appendChild(trail);

  setTimeout(() => trail.remove(), 600);
});

// smooth follow
function animate() {
  ball.style.left = mouseX + "px";
  ball.style.top = mouseY + "px";
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
