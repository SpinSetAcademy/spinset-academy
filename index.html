<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpinSet Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071008;
    color:white;
    font-family:Outfit,sans-serif;
    overflow-x:hidden;
}

/* CURSOR */
.cursor{
    width:18px;
    height:18px;
    background:#d7ff3f;
    border-radius:50%;
    position:fixed;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:9999;
    box-shadow:0 0 20px #d7ff3f;
}

/* INTRO */
.intro{
    position:fixed;
    inset:0;
    background:#071008;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* BIGGER RACKET */
.intro-racket{
    position:absolute;
    width:420px;
    left:-500px;
    top:35%;
    transform:rotate(-45deg);
    animation:racketSwing 2.2s ease forwards;
}

/* BALL THAT GOES THROUGH SCREEN */
.intro-ball{
    position:absolute;
    width:45px;
    height:45px;
    background:#d7ff3f;
    border-radius:50%;
    top:50%;
    left:-120px;
    box-shadow:0 0 25px #d7ff3f;
    animation:ballSmash 2.2s ease forwards;
}

/* LOGO */
.intro-logo{
    width:260px;
    opacity:0;
    animation:logoAppear 1s ease forwards;
    animation-delay:2s;
    filter:drop-shadow(0 0 40px #d7ff3f);
}

.intro-text{
    margin-top:20px;
    font-family:Orbitron,sans-serif;
    font-size:40px;
    letter-spacing:4px;
    opacity:0;
    animation:textAppear 1s ease forwards;
    animation-delay:2.4s;
}

/* FADE OUT INTRO */
.intro{
    animation:introFade 1s ease forwards;
    animation-delay:4s;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:20px 8%;
    background:rgba(0,0,0,0.5);
    z-index:1000;
}

nav a{
    color:white;
    margin-left:20px;
    text-decoration:none;
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* ANIMATIONS */

@keyframes racketSwing{
    0%{left:-500px; transform:rotate(-60deg);}
    60%{left:40%; transform:rotate(25deg);}
    100%{left:35%; transform:rotate(0deg);}
}

/* BALL GOES THROUGH SCREEN */
@keyframes ballSmash{
    0%{left:-120px; transform:scale(1);}
    50%{left:45%; transform:scale(1.4);}
    100%{left:120%; transform:scale(0.8); opacity:0;}
}

@keyframes logoAppear{
    to{opacity:1;}
}

@keyframes textAppear{
    to{opacity:1;}
}

@keyframes introFade{
    to{opacity:0; visibility:hidden;}
}

</style>

</head>

<body>

<div class="cursor"></div>

<!-- INTRO -->
<div class="intro">

<img src="racket.png" class="intro-racket">
<div class="intro-ball"></div>

<div style="text-align:center;">
<img src="logo.png" class="intro-logo">
<div class="intro-text">SPINSET ACADEMY</div>
</div>

</div>

<!-- NAV -->
<nav>
<div>SPINSET</div>
<div>
<a href="#about">About</a>
<a href="#classes">Classes</a>
<a href="#pricing">Pricing</a>
<a href="#faq">FAQ</a>
<a href="#contact">Contact</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1>Elite Tennis Training</h1>
</section>

<script>
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove",(e)=>{
cursor.style.left = e.clientX + "px";
cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
