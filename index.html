<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpinSet Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Outfit',sans-serif;
    background:#f6f8f6;
    color:#111;
    overflow-x:hidden;
}

/* CURSOR + TRAIL */
.ball{
    width:18px;
    height:18px;
    background:#ffd84d;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    z-index:9999;
    box-shadow:0 0 15px rgba(255,216,77,0.8);
}

.trail{
    width:10px;
    height:10px;
    opacity:0.4;
    background:#ffd84d;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(12px);
    z-index:1000;
}

.logo img{
    height:40px;
}

nav a{
    margin-left:18px;
    text-decoration:none;
    color:#111;
    font-weight:600;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    background:linear-gradient(135deg,#e8f5e9,#ffffff);
    overflow:hidden;
}

/* STADIUM LIGHT EFFECT */
.hero::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle,rgba(255,215,0,0.25),transparent 60%);
    top:-150px;
    left:50%;
    transform:translateX(-50%);
    animation:lightMove 6s infinite ease-in-out;
}

/* PARALLAX LOGO */
.hero img{
    width:280px;
    animation:float 4s ease-in-out infinite;
    z-index:2;
}

/* SECTIONS */
section{
    padding:100px 10%;
}

.title{
    font-size:40px;
    text-align:center;
    margin-bottom:40px;
}

/* CARDS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);

    transform-style:preserve-3d;
    transition:0.3s;
}

/* 3D HOVER */
.card:hover{
    transform:rotateX(8deg) rotateY(-8deg) scale(1.03);
}

/* SCROLL REVEAL */
.reveal{
    opacity:0;
    transform:translateY(40px);
    transition:0.8s ease;
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

/* CONTACT */
.contact{
    background:#fff;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
}

/* ANIMATIONS */
@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

@keyframes lightMove{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-40%) scale(1.1);}
}

</style>

</head>

<body>

<!-- BALL CURSOR -->
<div class="ball"></div>

<!-- NAV -->
<nav>
    <div class="logo">
        <img src="logo.png">
    </div>

    <div>
        <a href="#about">About</a>
        <a href="#classes">Classes</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">

    <img src="logo.png" class="parallax">

</section>

<!-- ABOUT -->
<section id="about" class="reveal">

<h2 class="title">About</h2>

<div class="card">
SpinSet Academy trains young players with focus on movement, consistency, and confidence.
</div>

</section>

<!-- CLASSES -->
<section id="classes" class="reveal">

<h2 class="title">Classes</h2>

<div class="grid">

<div class="card">
Group Training for beginners
</div>

<div class="card">
Private Coaching sessions
</div>

</div>

</section>

<!-- CONTACT -->
<section id="contact" class="reveal">

<h2 class="title">Contact</h2>

<div class="contact">
spinsetacademy@gmail.com
</div>

</section>

<script>

/* BALL CURSOR + TRAIL */
const ball = document.querySelector('.ball');
let trail = [];

document.addEventListener('mousemove', (e)=>{

ball.style.left = e.clientX + 'px';
ball.style.top = e.clientY + 'px';

trail.push({x:e.clientX,y:e.clientY});

if(trail.length > 12) trail.shift();

document.querySelectorAll('.trail').forEach(t=>t.remove());

trail.forEach((p,i)=>{
    let d = document.createElement('div');
    d.className='trail';
    d.style.left = p.x + 'px';
    d.style.top = p.y + 'px';
    d.style.opacity = i/12;
    document.body.appendChild(d);
});

});

/* SCROLL REVEAL */
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add('active');
        }
    });
});

document.querySelectorAll('.reveal').forEach(el=>{
    observer.observe(el);
});

/* PARALLAX */
document.addEventListener('mousemove',(e)=>{
    document.querySelector('.parallax').style.transform =
    `translate(${e.clientX*0.02}px, ${e.clientY*0.02}px)`;
});

</script>

</body>
</html>
