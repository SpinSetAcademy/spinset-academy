<!-- COMMENTS SECTION -->
<section id="comments" class="reveal">

<h2 class="title">COMMENTS & QUESTIONS</h2>

<div class="comments-box">

<input type="text" id="nameInput" placeholder="Your Name">

<textarea id="commentInput" placeholder="Questions, concerns, or feedback..."></textarea>

<button onclick="addComment()" class="btn">
Post Comment
</button>

<div id="commentsContainer"></div>

</div>

</section>

<!-- BOOKING CALENDAR -->
<section id="calendar" class="reveal">

<h2 class="title">BOOK A LESSON</h2>

<div class="calendar-container">

<div class="calendar-header">

<button onclick="changeMonth(-1)">◀</button>

<h3 id="monthYear"></h3>

<button onclick="changeMonth(1)">▶</button>

</div>

<div class="calendar" id="calendar"></div>

<p class="calendar-legend">
<span class="available-box"></span> Available
<span class="taken-box"></span> Taken
</p>

</div>

</section>

<style>

/* COMMENTS */

.comments-box{
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.comments-box input,
.comments-box textarea{

    width:100%;

    padding:16px;

    margin-bottom:18px;

    border-radius:12px;

    border:1px solid #ccc;

    font-family:'Outfit',sans-serif;

    font-size:16px;
}

.comments-box textarea{
    min-height:140px;
    resize:vertical;
}

.comment{
    margin-top:18px;
    padding:18px;
    background:#f5f5f5;
    border-radius:14px;
}

/* CALENDAR */

.calendar-container{
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.calendar-header button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#2a7a3f;
    color:white;
    font-size:18px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:12px;
}

.day{
    padding:18px;
    border-radius:14px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.available{
    background:#b7ffb7;
    color:#115511;
}

.taken{
    background:#ffb8b8;
    color:#771111;
}

.day:hover{
    transform:scale(1.08);
}

.calendar-legend{
    margin-top:20px;
    display:flex;
    gap:20px;
    align-items:center;
}

.available-box,
.taken-box{
    width:18px;
    height:18px;
    display:inline-block;
    border-radius:5px;
    margin-right:6px;
}

.available-box{
    background:#b7ffb7;
}

.taken-box{
    background:#ffb8b8;
}

</style>

<script>

/* COMMENTS */

function addComment(){

    const name = document.getElementById("nameInput").value;
    const comment = document.getElementById("commentInput").value;

    if(name === "" || comment === ""){
        alert("Please fill out both fields.");
        return;
    }

    const commentDiv = document.createElement("div");
    commentDiv.classList.add("comment");

    commentDiv.innerHTML = `
        <strong>${name}</strong>
        <p>${comment}</p>
    `;

    document.getElementById("commentsContainer").prepend(commentDiv);

    document.getElementById("nameInput").value = "";
    document.getElementById("commentInput").value = "";
}

/* CALENDAR */

const calendar = document.getElementById("calendar");
const monthYear = document.getElementById("monthYear");

let currentDate = new Date();

const takenDates = [5, 8, 14, 20];

function renderCalendar(){

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const firstDay = new Date(year, month, 1).getDay();

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const monthNames = [
        "January","February","March","April",
        "May","June","July","August",
        "September","October","November","December"
    ];

    monthYear.innerText =
    `${monthNames[month]} ${year}`;

    for(let i = 0; i < firstDay; i++){

        const blank = document.createElement("div");
        calendar.appendChild(blank);

    }

    for(let day = 1; day <= daysInMonth; day++){

        const dayDiv = document.createElement("div");

        dayDiv.classList.add("day");

        dayDiv.innerText = day;

        if(takenDates.includes(day)){

            dayDiv.classList.add("taken");

        }else{

            dayDiv.classList.add("available");

            dayDiv.onclick = () => {

                alert(
                    `You selected ${monthNames[month]} ${day}.`
                );

            };

        }

        calendar.appendChild(dayDiv);

    }

}

function changeMonth(direction){

    currentDate.setMonth(
        currentDate.getMonth() + direction
    );

    renderCalendar();

}

renderCalendar();

</script>
